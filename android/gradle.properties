org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler fails to close its own cache files on this
# Windows setup, which breaks the release build of plugin modules
# (:share_plus:compileReleaseKotlin) with "Could not close incremental
# caches". Incremental compilation only saves time on repeat builds of
# unchanged plugin code, so turning it off costs very little here.
kotlin.incremental=false
